<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Ciências: Métodos e Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- HEADER E ESTRUTURA ORIGINAL -->
    <header class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold title-font text-white">Laboratório Virtual</h1>
            <div class="bg-slate-900/90 border border-slate-800 rounded-lg px-4 py-2 font-bold text-amber-400">
                Pontos: <span id="score-counter">1000</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid lg:grid-cols-12 gap-6">
        <section class="lg:col-span-8">
            <div id="player-wrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-700">
                <div id="yt-player-container" class="absolute inset-0 w-full h-full"></div>
                <!-- Overlay de Quiz -->
                <div id="quiz-container" class="absolute inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-6">
                    <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl max-w-lg w-full">
                        <h2 id="question-text" class="text-xl font-bold mb-6">Carregando desafio...</h2>
                        <div id="options-container" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </section>
        <section class="lg:col-span-4 bg-slate-900/80 rounded-2xl p-6 border border-slate-800">
            <h3 class="font-bold text-white mb-4">Diário de Bordo</h3>
            <div id="log-content" class="text-slate-400 text-sm">O vídeo precisa de ser iniciado.</div>
        </section>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let score = 1000;
        const QUIZ_DATA = [
            { time: 10, question: "Qual o primeiro passo do método?", options: ["Observação", "Testar", "Concluir"], correct: 0 },
            { time: 25, question: "O que é uma hipótese?", options: ["Verdade absoluta", "Suposição testável", "Regra"], correct: 1 }
        ];
        let answeredQuestions = new Set();

        function onYouTubeIframeAPIReady() {
            const container = document.getElementById('yt-player-container');
            container.innerHTML = '<div id="yt-player" class="absolute inset-0 w-full h-full pointer-events-none"></div>';
            player = new YT.Player('yt-player', {
                videoId: 'qynHlQkj93Y',
                playerVars: { 'autoplay': 0, 'controls': 0, 'fs': 0, 'modestbranding': 1 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            const btn = document.createElement('button');
            btn.innerHTML = "INICIAR AULA";
            btn.className = "absolute z-[60] bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-8 rounded-2xl animate-bounce shadow-2xl";
            btn.style.top = "50%"; btn.style.left = "50%"; btn.style.transform = "translate(-50%, -50%)";
            
            btn.onclick = () => {
                event.target.unMute();
                event.target.playVideo();
                btn.remove();
                startMonitoring();
            };
            document.getElementById('player-wrapper').appendChild(btn);
        }

        function startMonitoring() {
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const time = player.getCurrentTime();
                    QUIZ_DATA.forEach((q, index) => {
                        if (time >= q.time && !answeredQuestions.has(index)) {
                            pauseAndShowQuiz(q, index);
                        }
                    });
                }
            }, 1000);
        }

        function pauseAndShowQuiz(q, index) {
            player.pauseVideo();
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('question-text').innerText = q.question;
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = '';
            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "w-full p-4 bg-slate-800 hover:bg-slate-700 rounded-xl text-left border border-slate-700 transition";
                b.innerText = opt;
                b.onclick = () => {
                    if(i === q.correct) score += 200;
                    document.getElementById('score-counter').innerText = score;
                    answeredQuestions.add(index);
                    document.getElementById('quiz-container').classList.add('hidden');
                    player.playVideo();
                };
                optCont.appendChild(b);
            });
        }
    </script>
</body>
</html>
