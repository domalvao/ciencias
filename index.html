<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Ciências: Métodos e Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-950 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400">Laboratório Virtual</h1>
            <div id="score-display" class="bg-slate-900 px-4 py-2 rounded-lg font-bold text-amber-400">Pontos: 0</div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid lg:grid-cols-12 gap-6">
        <section class="lg:col-span-8">
            <div id="yt-player-container" class="relative aspect-video bg-black rounded-xl overflow-hidden border border-slate-700"></div>
        </section>
        <section class="lg:col-span-4 bg-slate-900 p-6 rounded-xl border border-slate-700">
            <div id="quiz-container">
                <h2 class="text-lg font-semibold mb-4">Desafio do Laboratório</h2>
                <div id="question-text" class="mb-4">Inicie a aula para começar o desafio.</div>
                <div id="options-container" class="space-y-2"></div>
            </div>
        </section>
    </main>

    <div id="welcome-modal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 p-8 rounded-2xl max-w-md w-full text-center border border-slate-700">
            <h2 class="text-2xl font-bold mb-4">Bem-vindo ao Laboratório</h2>
            <input type="text" id="player-name" placeholder="Seu nome" class="w-full p-3 mb-4 rounded bg-slate-800 border border-slate-700 text-white">
            <button onclick="startGame()" class="w-full bg-indigo-600 py-3 rounded font-bold hover:bg-indigo-500">Começar</button>
        </div>
    </div>

    <script>
        let player, playerName, score = 0;
        const questions = [
            { q: "Qual o primeiro passo do método científico?", a: ["Observação", "Experimento"], correct: 0 },
            { q: "O que é uma hipótese?", a: ["Uma suposição testável", "Uma conclusão final"], correct: 0 }
        ];
        let currentQ = 0;

        function startGame() {
            playerName = document.getElementById('player-name').value;
            if(!playerName) return;
            document.getElementById('welcome-modal').remove();
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.body.appendChild(tag);
        }

        window.onYouTubeIframeAPIReady = () => {
            const container = document.getElementById('yt-player-container');
            container.innerHTML = '<div id="yt-player" class="absolute inset-0 w-full h-full pointer-events-none"></div>';
            player = new YT.Player('yt-player', {
                videoId: 'qynHlQkj93Y',
                playerVars: { 'autoplay': 0, 'controls': 0, 'fs': 0 },
                events: { 'onReady': onReady }
            });
        };

        function onReady(event) {
            const btn = document.createElement('button');
            btn.innerHTML = "INICIAR AULA";
            btn.className = "absolute z-50 bg-indigo-600 px-8 py-4 rounded-xl font-bold shadow-2xl animate-pulse";
            btn.onclick = () => {
                event.target.unMute();
                event.target.playVideo();
                btn.remove();
                showQuestion();
            };
            document.getElementById('yt-player-container').appendChild(btn);
        }

        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = q.q;
            const opt = document.getElementById('options-container');
            opt.innerHTML = '';
            q.a.forEach((text, i) => {
                const b = document.createElement('button');
                b.className = "w-full p-3 bg-slate-800 rounded hover:bg-slate-700";
                b.innerText = text;
                b.onclick = () => checkAnswer(i);
                opt.appendChild(b);
            });
        }

        function checkAnswer(i) {
            if(i === questions[currentQ].correct) score += 100;
            document.getElementById('score-display').innerText = "Pontos: " + score;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else document.getElementById('quiz-container').innerText = "Fim do desafio! Parabéns.";
        }
    </script>
</body>
</html>
