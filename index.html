<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Desafio de Ciências: Métodos e Técnicas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased">

    <header class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-flask text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold title-font text-white">Laboratório Virtual</h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div id="player-name-container" class="bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 flex items-center gap-2 hidden">
                    <i class="fa-solid fa-user-astronaut text-indigo-400"></i>
                    <span id="player-name-display" class="font-bold text-indigo-400 text-xs uppercase"></span>
                </div>
                <div class="bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span id="score-counter" class="font-bold text-amber-400">1000</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <section class="lg:col-span-8">
            <div class="relative bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden aspect-video">
                <div id="yt-player-container" class="absolute inset-0 w-full h-full bg-slate-900 flex items-center justify-center">
                    <!-- O player será injetado aqui -->
                </div>
            </div>
        </section>
        <section class="lg:col-span-4 bg-slate-900/80 rounded-2xl p-6 border border-slate-800">
            <div id="quiz-container" class="space-y-4">
                <h3 class="font-bold text-white mb-4">Progresso do Desafio</h3>
                <div id="question-text" class="text-sm text-slate-300">Aguardando início da aula...</div>
                <div id="options-group" class="space-y-2"></div>
            </div>
        </section>
    </main>

    <!-- MODAL DE BOAS-VINDAS -->
    <div id="welcome-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-[60]">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 text-center space-y-6">
            <h2 class="text-2xl font-bold text-white">Laboratório de Didática</h2>
            <p class="text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800 text-left">
                Aviso: Esse game foi criado com IA e pode conter equívocos. Fale com o Alvão se necessário.
            </p>
            <input type="text" id="player-name-input" placeholder="Escreve o teu nome..." class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3">
            <button onclick="registerPlayerAndStart()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">Concordo, seguir</button>
        </div>
    </div>

    <script>
        let player = null;
        let playerName = "";

        function registerPlayerAndStart() {
            const inputName = document.getElementById('player-name-input').value.trim();
            if (inputName.length === 0) return;
            playerName = inputName;
            document.getElementById('player-name-display').innerText = playerName;
            document.getElementById('player-name-container').classList.remove('hidden');
            document.getElementById('welcome-modal').remove();
            
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.body.appendChild(tag);
        }

        window.onYouTubeIframeAPIReady = function() {
            const container = document.getElementById('yt-player-container');
            container.innerHTML = '<div id="yt-player" class="absolute inset-0 w-full h-full pointer-events-none"></div>';
            
            player = new YT.Player('yt-player', {
                videoId: 'qynHlQkj93Y',
                playerVars: { 'autoplay': 0, 'controls': 0, 'fs': 0, 'modestbranding': 1, 'origin': window.location.origin },
                events: { 'onReady': onPlayerReady }
            });
        };

        function onPlayerReady(event) {
            const container = document.getElementById('yt-player-container');
            const startBtn = document.createElement('button');
            startBtn.innerHTML = '<i class="fa-solid fa-play text-4xl"></i><span class="block mt-2">Clique para iniciar a aula</span>';
            startBtn.className = "absolute z-50 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-6 px-10 rounded-2xl shadow-2xl transition-all animate-bounce";
            
            startBtn.onclick = () => {
                event.target.unMute();
                event.target.playVideo();
                startBtn.remove();
                document.getElementById('question-text').innerText = "Aula iniciada. Fique atento aos desafios!";
            };
            container.appendChild(startBtn);
        }
    </script>
</body>
</html>
